<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EL NIDO</title>
<style>
body{margin:0;font-family:Arial;background:#120000;color:#fff}
header{text-align:center;padding:20px}
h1{color:#ff0033}
.panel{position:fixed;top:20px;right:20px;background:rgba(255,255,255,.08);padding:15px;border-radius:12px}
input,select,button{display:block;width:100%;margin:8px 0;padding:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:20px}
.card{background:#1b1b1b;padding:10px;border-radius:10px}
.card img{width:100%;border-radius:8px}
.nav{display:flex;gap:10px;justify-content:center}
.nav button{width:auto}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9)}
.modal-content{width:90%;height:80%;margin:3% auto}
.modal iframe{width:100%;height:100%}
.close{float:right}
</style>
</head>
<body>
<header><h1>EL NIDO</h1></header>

<div class="panel">
<select id="tipo">
<option value="peliculas">Película</option>
<option value="series">Serie</option>
<option value="musica">Música</option>
</select>
<input id="titulo" placeholder="Título">
<input id="url" placeholder="URL YouTube">
<button onclick="agregar()">Agregar</button>
</div>

<div class="nav">
<button onclick="mostrar('peliculas')">Películas</button>
<button onclick="mostrar('series')">Series</button>
<button onclick="mostrar('musica')">Música</button>
</div>

<div id="contenedor" class="grid"></div>

<div id="modal" class="modal">
<div class="modal-content">
<button class="close" onclick="cerrar()">Cerrar</button>
<iframe id="player" allowfullscreen></iframe>
</div>
</div>

<script>
let datos=JSON.parse(localStorage.getItem('elnido')||'[]');
let actual='peliculas';

function idYT(u){
 let m=u.match(/(?:v=|youtu\.be\/)([^&]+)/);
 return m?m[1]:'';
}

function agregar(){
 let item={
  tipo:tipo.value,
  titulo:titulo.value,
  url:url.value
 };
 datos.push(item);
 localStorage.setItem('elnido',JSON.stringify(datos));
 render();
}

function mostrar(t){actual=t;render();}

function abrir(url){
 let id=idYT(url);
 player.src='https://www.youtube.com/embed/'+id;
 modal.style.display='block';
}

function cerrar(){
 modal.style.display='none';
 player.src='';
}

function render(){
 contenedor.innerHTML='';
 datos.filter(x=>x.tipo===actual).forEach(x=>{
  let id=idYT(x.url);
  contenedor.innerHTML+=`
  <div class="card">
  <img src="https://img.youtube.com/vi/${id}/hqdefault.jpg">
  <h3>${x.titulo}</h3>
  <button onclick="abrir('${x.url}')">Ver</button>
  <button onclick="window.open('${x.url}')">YouTube</button>
  </div>`;
 });
}
render();
</script>
</body>
</html>
